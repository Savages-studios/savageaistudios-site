name: Authenticated storefront offer audit (review only)
on:
  push:
    branches:
      - gpt/storefront-provider-catalog-audit-20261103
  pull_request:
    branches:
      - gpt/commercial-fulfillment-reconciliation-20261102
permissions:
  contents: read
jobs:
  site-and-storefront:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source SHA and actual site tests
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD
          npm test 2>&1 | tee storefront-audit-tests.log
      - name: Retain exact-run raw tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-audit-${{ matrix.os }}
          path: storefront-audit-tests.log
          if-no-files-found: error
